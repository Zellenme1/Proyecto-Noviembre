services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html/src
      - ./public:/var/www/html/public
      - ./templates:/var/www/html/templates
    environment:
      - DB_HOST=db
      - DB_NAME=trueques_db
      - DB_USER=usuario_trueque
      - DB_PASS=password_secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: trueques_db
      MYSQL_USER: usuario_trueque
      MYSQL_PASSWORD: password_secret
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Todo lo que haya en db/ se ejecuta, por orden de nombre, al crear la base por primera vez
      - ./db:/docker-entrypoint-initdb.d


  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: usuario_trueque
      PMA_PASSWORD: password_secret
    depends_on:
      - db

volumes:
  db_data:
