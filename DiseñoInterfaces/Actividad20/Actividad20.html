<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto destacado</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>EcoStore</h1>
        <nav>
            <a href="#productos">Productos</a>
            <a href="#ofertas">Ofertas</a>
        </nav>
    </header>

    <main class="producto">
        <div class="imagen">
            <img src="https://picsum.photos/id/21/700/700"
                 alt="Imagen ilustrativa del producto">
        </div>

        <section class="detalle">
            <p class="categoria">Accesorios</p>
            <h2>Mochila urbana</h2>
            <p class="precio">49,95 €</p>
            <p>Una mochila versátil para el día a día.</p>

            <ul>
                <li>Diseño ligero</li>
                <li>Varios compartimentos</li>
                <li>Uso diario</li>
            </ul>

            <button type="button">Añadir al carrito</button>
        </section>
    </main>
</body>
</html>
