<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de control</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Admin</h2>
            <nav>
                <a href="#resumen">Resumen</a>
                <a href="#usuarios">Usuarios</a>
                <a href="#informes">Informes</a>
                <a href="#ajustes">Ajustes</a>
            </nav>
        </aside>

        <div class="principal">
            <header>
                <h1>Panel de control</h1>
                <p>Bienvenido de nuevo.</p>
            </header>

            <main id="resumen" class="estadisticas">
                <article>
                    <h2>Usuarios</h2>
                    <p class="valor">1.250</p>
                </article>

                <article>
                    <h2>Pedidos</h2>
                    <p class="valor">384</p>
                </article>

                <article>
                    <h2>Ingresos</h2>
                    <p class="valor">8.420 €</p>
                </article>

                <article id="informes">
                    <h2>Actividad reciente</h2>
                    <p>Se han registrado nuevos pedidos.</p>
                </article>
            </main>
        </div>
    </div>
</body>
</html>
