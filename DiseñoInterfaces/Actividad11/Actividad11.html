<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de viajes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Galería de viajes</h1>

    <main class="galeria">
        <figure>
            <img src="https://picsum.photos/id/1015/600/400"
                 alt="Paisaje de montaña junto a un río">
            <figcaption>Montaña</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1011/600/400"
                 alt="Paisaje natural con árboles">
            <figcaption>Naturaleza</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1018/600/400"
                 alt="Paisaje de montaña y valle">
            <figcaption>Aventura</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1036/600/400"
                 alt="Paisaje de costa">
            <figcaption>Costa</figcaption>
        </figure>
    </main>
</body>
</html>
