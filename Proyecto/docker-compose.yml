services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=trueques_db
      - DB_USER=usuario_trueque
      - DB_PASS=password_secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: trueques_db
      MYSQL_USER: usuario_trueque
      MYSQL_PASSWORD: password_secret
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql

volumes:
  db_data: