# ==============================================================================
# CONFIGURACIÓN DEL VIRTUAL HOST DE APACHE PARA LA APLICACIÓN
# ==============================================================================

<VirtualHost *:80>
    # Dirección de correo del administrador del servidor
    ServerAdmin webmaster@localhost

    # --------------------------------------------------------------------------
    # DOCUMENT ROOT (RAÍZ DEL SERVIDOR WEB)
    # --------------------------------------------------------------------------
    # Redirige todo el tráfico web a la carpeta 'public'. 
    # Esto aísla el código fuente sensible (src, templates, vendor, .env) 
    # impidiendo su acceso directo desde el navegador.
    DocumentRoot /var/www/html/public

    # --------------------------------------------------------------------------
    # DIRECTIVAS DE SEGURIDAD Y PERMISOS DE LA CARPETA PÚBLICA
    # --------------------------------------------------------------------------
    <Directory /var/www/html/public>
        # Indexes: Muestra el listado de archivos si no hay index.
        # FollowSymLinks: Permite al servidor seguir enlaces simbólicos.
        Options Indexes FollowSymLinks

        # AllowOverride All: CRUCIAL. Otorga permiso a Apache para leer y aplicar 
        # las reglas de reescritura declaradas dentro del archivo '.htaccess'.
        AllowOverride All

        # Permite el acceso público sin restricción de IP a todos los archivos estáticos de esta carpeta
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # ARCHIVOS DE LOGS
    # --------------------------------------------------------------------------
    # Registra errores del servidor y accesos HTTP dentro de la carpeta estándar de logs de Apache
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
