# ==============================================================================
# CONFIGURACIÓN DEL VIRTUAL HOST DE APACHE PARA LA APLICACIÓN
# ==============================================================================

# Evita el aviso AH00558 al arrancar Apache.
ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # --------------------------------------------------------------------------
    # DOCUMENT ROOT
    # --------------------------------------------------------------------------
    # Solo la carpeta 'public' es accesible desde el navegador. El código
    # (src, templates, vendor) queda fuera del alcance de las peticiones HTTP.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Sin 'Indexes': no se listan los archivos de una carpeta.
        Options -Indexes +FollowSymLinks

        # Permite que un .htaccess (si existe) pueda añadir reglas.
        AllowOverride All

        # FRONT CONTROLLER: toda ruta que no corresponda a un archivo real
        # (/login, /servicios-spa, /api/...) la atiende /index.php.
        # Hace lo mismo que las reglas de mod_rewrite del .htaccess, pero vive
        # aquí, así que la aplicación funciona aunque el .htaccess se pierda
        # (es un archivo oculto y es fácil que no se copie).
        FallbackResource /index.php

        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
