services:
  web:
    build: .
    container_name: ejercicio_php_web
    ports:
      - "8080:80"
    volumes:
      - ../app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ejercicio_php_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ejercicio
    volumes:
      - ../app/database.sql:/docker-entrypoint-initdb.d/database.sql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ejercicio_php_pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db